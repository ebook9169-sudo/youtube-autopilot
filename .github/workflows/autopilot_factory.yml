name: Autonomous YouTube Production Factory (2-3x Weekly)

on:
  push:
    branches:
      - feature/pro-autopilot
  workflow_dispatch:
    inputs:
      niche_override:
        description: 'Optional Custom Story Idea (Leave blank for automatic Vinsa 7-Rules Story)'
        required: false
        default: ''
  schedule:
    - cron: '0 13 * * 2,4,6'

jobs:
  produce-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Install FFmpeg, Fonts & Audio Mastering Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libsm6 libxext6 fonts-liberation fonts-dejavu-core

      - name: 3. Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 4. Install Free AI & Video Pipeline Packages
        run: |
          pip install --upgrade pip
          pip install edge-tts gTTS requests Pillow numpy google-api-python-client google-auth-oauthlib

      - name: 5. Run Multi-Layer Creepy Pictogram Pipeline
        env:
          GEMINI_KEY_1: ${{ secrets.GEMINI_KEY_1 }}
          GEMINI_KEY_2: ${{ secrets.GEMINI_KEY_2 }}
          GROQ_KEY_1: ${{ secrets.GROQ_KEY_1 }}
          GROQ_KEY_2: ${{ secrets.GROQ_KEY_2 }}
          ELEVENLABS_KEY_1: ${{ secrets.ELEVENLABS_KEY_1 }}
          ELEVENLABS_KEY_2: ${{ secrets.ELEVENLABS_KEY_2 }}
          HF_TOKEN_1: ${{ secrets.HF_TOKEN_1 }}
          HF_TOKEN_2: ${{ secrets.HF_TOKEN_2 }}
          PEXELS_KEY_1: ${{ secrets.PEXELS_KEY_1 }}
          PEXELS_KEY_2: ${{ secrets.PEXELS_KEY_2 }}
          YT_TOKEN_JSON: ${{ secrets.YT_TOKEN_JSON }}
          NICHE_OVERRIDE: ${{ github.event.inputs.niche_override }}
        run: |
          python run_autopilot.py

      - name: 6. Upload Mastered Videos & Publishing Package
        uses: actions/upload-artifact@v4
        with:
          name: youtube-studio-package
          path: |
            output/long_video_16x9.mp4
            output/short_video_9x16.mp4
            output/thumbnail_16x9.jpg
            output/publishing_package.txt
            output/audit_report.json
          retention-days: 7
